<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un compte</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Créer un compte</h1>

    <form id="signupForm">
        <label>Nom d'utilisateur :</label><br>
        <input type="text" name="username" required><br>

        <label>Mot de passe :</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Créer le compte</button>
    </form>

    <div id="result" style="margin-top:20px;"></div>

    <p>Vous avez déjà un compte ? <a href="/login_page">Se connecter</a></p>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;

            const data = {
                username: form.username.value,
                password: form.password.value
            };

            try {
                const res = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if(res.ok) {
                    document.getElementById('result').innerText = "Compte créé avec succès ! Redirection vers login...";
                    setTimeout(() => window.location.href = '/login_page', 1500);
                } else {
                    document.getElementById('result').innerText = result.error || "Erreur inconnue";
                }
            } catch (err) {
                document.getElementById('result').innerText = "Erreur : " + err;
            }
        });
    </script>
</body>
</html>
